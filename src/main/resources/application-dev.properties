quarkus.datasource.db-kind=sqlite
quarkus.datasource.jdbc.url=jdbc:sqlite:accounts.db
quarkus.datasource.jdbc.min-size=1
quarkus.datasource.jdbc.max-size=4
quarkus.datasource.jdbc.acquisition-timeout=30S
quarkus.hibernate-orm.database.generation=update

quarkus.http.port=9090
quarkus.http.auth.session.encryption-key=dev-only-change-me-32-chars!!
identity.seed.enabled=true
quarkus.http.cors.origins=http://localhost
quarkus.mailer.mock=false
quarkus.mailer.from=no-reply@token-svc.local
quarkus.mailer.host=localhost
quarkus.mailer.port=1025
quarkus.mailer.start-tls=DISABLED

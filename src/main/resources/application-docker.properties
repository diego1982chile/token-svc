quarkus.datasource.db-kind=sqlite
quarkus.datasource.jdbc.url=jdbc:sqlite:accounts.db
quarkus.datasource.jdbc.min-size=1
quarkus.datasource.jdbc.max-size=4
quarkus.datasource.jdbc.acquisition-timeout=30S
quarkus.hibernate-orm.database.generation=update

quarkus.http.root-path=api
quarkus.http.port=8080
quarkus.http.auth.basic=true
quarkus.http.auth.session.encryption-key=${AUTH_SESSION_ENCRYPTION_KEY}
identity.seed.enabled=${IDENTITY_SEED_ENABLED:false}

token.issuer=${JWT_ISSUER}
token.audience=${JWT_AUDIENCE}
quarkus.http.cors.origins=${CORS_ORIGINS:http://localhost}

quarkus.mailer.mock=${MAIL_MOCK:false}
quarkus.mailer.from=${MAIL_FROM:no-reply@token-svc.local}
quarkus.mailer.host=${MAIL_HOST:mailpit}
quarkus.mailer.port=${MAIL_PORT:1025}
quarkus.mailer.start-tls=${MAIL_START_TLS:DISABLED}

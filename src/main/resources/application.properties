quarkus.http.root-path=/token-service

# security
quarkus.http.auth.basic=false
quarkus.http.auth.form.enabled=true
quarkus.http.auth.form.timeout=1M
quarkus.http.auth.form.login-page=/login
quarkus.http.auth.form.error-page=/login?error
quarkus.http.auth.form.cookie-name=MYSESSIONID
quarkus.http.auth.form.http-only-cookie=true
quarkus.http.auth.session.encryption-key=${AUTH_SESSION_ENCRYPTION_KEY}
vaadin.closeIdleSessions=true

security.private.key=/privateKey.pem
token.issuer=${JWT_ISSUER:https://apis.internal.dsoto.cl}
token.audience=${JWT_AUDIENCE:identity-svc}
app.name=${APP_NAME:Token-SVC}
app.public-url=${APP_PUBLIC_URL:http://localhost:9090/token-service}
email.confirmation.subject=${EMAIL_CONFIRMATION_SUBJECT:Confirma tu correo}
email.confirmation.ttl-hours=${EMAIL_CONFIRMATION_TTL_HOURS:24}
email.confirmation.time-zone=${EMAIL_CONFIRMATION_TIME_ZONE:America/Santiago}

# Atmosphere
atmosphere.enabled=true
atmosphere.heartbeatInterval=30
atmosphere.suspendTime=60000

# CORS
quarkus.http.cors=true
quarkus.http.cors.origins=${CORS_ORIGINS:http://localhost}
quarkus.http.cors.headers=accept, authorization, content-type, x-requested-with
quarkus.http.cors.methods=GET, POST, PUT, DELETE, OPTIONS, HEAD
quarkus.http.cors.access-control-allow-credentials=true
